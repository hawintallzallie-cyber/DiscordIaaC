name: validate

# The fast gate. Needs no credentials and no network access to Discord, so it
# runs on every push and pull request and fails in well under a minute.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.label }})
    runs-on: ubuntu-latest

    # `terraform init -backend=false` turns out to work even on the environment
    # roots, despite their `cloud {}` block -- verified against Terraform 1.17.
    # So all three directories are validated here, with no HCP token and no
    # Discord token in scope. Only `plan` needs credentials.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: module
            dir: modules/discord-server
          - label: staging
            dir: environments/staging
          - label: production
            dir: environments/production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: tflint --recursive --minimum-failure-severity=warning
