name: apply

# Promotion. A merge to main applies to staging immediately, then waits for a
# human to approve the production job.
#
# The gate is not in this file -- it is the `environment: production` setting
# below, combined with a required reviewer configured on that GitHub
# Environment. Putting the gate in GitHub rather than in YAML means it cannot
# be removed by editing a workflow in the same pull request it is guarding.

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two applies touch the same server at once.
concurrency:
  group: apply-discord
  cancel-in-progress: false

jobs:
  staging:
    name: apply staging
    runs-on: ubuntu-latest
    environment: staging

    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: discord-staging
      TF_IN_AUTOMATION: 'true'
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false
        working-directory: environments/staging

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
        working-directory: environments/staging

  production:
    name: apply production
    runs-on: ubuntu-latest
    needs: staging
    environment: production

    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: discord-production
      TF_IN_AUTOMATION: 'true'
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false
        working-directory: environments/production

      # Planned again here rather than reusing the pull request's plan file.
      # The saved plan is tied to a state serial, and staging's apply may have
      # moved things; re-planning means the approver sees what will really run.
      - name: Plan
        run: terraform plan -no-color -input=false -out=tfplan -lock-timeout=5m
        working-directory: environments/production

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m tfplan
        working-directory: environments/production
