name: apply

# Promotion, as a private repository on GitHub Free can actually enforce it.
#
# The original design gated production behind a GitHub Environment with a
# required reviewer. That does not work here: deployment protection rules are
# public-repository-only on Free, so `environment: production` would be
# decorative and a merge to main would apply straight to the live server with
# nothing stopping it. See ADR 0007.
#
# So the gate is the trigger itself. Staging applies automatically on a merge.
# Production runs ONLY from a deliberate manual dispatch, and only when the
# operator types APPLY into the confirmation box. There is no path from a
# `git push` to a production apply.

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/apply.yml'

  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to apply'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm:
        description: 'Type APPLY to confirm. Required for production, ignored for staging.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Never let two applies touch the same server at once.
concurrency:
  group: apply-discord
  cancel-in-progress: false

jobs:
  staging:
    name: apply staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' || inputs.target == 'staging'

    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: discord-staging
      TF_IN_AUTOMATION: 'true'
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false
        working-directory: environments/staging

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
        working-directory: environments/staging

  production:
    name: apply production
    runs-on: ubuntu-latest
    environment: production

    # Three conditions, all required. A push cannot satisfy the first one, so
    # production is unreachable from a merge no matter what else is true.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' &&
      inputs.confirm == 'APPLY'

    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: discord-production
      TF_IN_AUTOMATION: 'true'
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

    steps:
      - name: Refuse to run from a branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production applies run from main only. This dispatch used ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false
        working-directory: environments/production

      # Planned here rather than reusing the pull request's plan file: a saved
      # plan is tied to a state serial, and staging's apply may have moved
      # things since. Re-planning means the log shows what actually ran.
      - name: Plan
        run: terraform plan -no-color -input=false -out=tfplan -lock-timeout=5m
        working-directory: environments/production

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m tfplan
        working-directory: environments/production
